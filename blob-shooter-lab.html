<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Blob Shooter Lab</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>:root{
  --bg:#0e1517; --panel:#172124; --panel2:#1d2a2e; --line:#2c3d42; --ink:#e9f1ee; --dim:#8fa5a6;
  --pink:#ff6fb1; --gold:#ffd23f; --green:#7be08a; --red:#ff6b6b; --blue:#6cc4ff;
  --font:'Fredoka','Trebuchet MS',system-ui,sans-serif; --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;
  padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:12px}
h1{margin:0;font-size:22px;letter-spacing:.02em}
h1 small{font-weight:500;color:var(--dim);font-size:13px;margin-left:8px}
h2{margin:0 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.chip{padding:5px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-weight:600}
.chip.ok{border-color:var(--green);color:var(--green)} .chip.warn{border-color:var(--gold);color:var(--gold)} .chip.bad{border-color:var(--red);color:var(--red)}
.grid{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr) minmax(260px,330px);gap:12px;align-items:start}
@media (max-width:1050px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.sticks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stick{display:flex;flex-direction:column;align-items:center;gap:4px}
.stick canvas{width:100%;max-width:150px;aspect-ratio:1;display:block}
.num{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center;font-variant-numeric:tabular-nums;line-height:1.5}
.num b{color:var(--ink);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--dim);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.trig{display:grid;grid-template-columns:24px 1fr 38px;gap:6px;align-items:center;margin-top:8px;font-size:12px}
.bar{height:12px;background:var(--panel2);border-radius:6px;position:relative;overflow:hidden}
.bar>b{position:absolute;left:0;top:0;bottom:0;background:var(--blue)} .bar.down>b{background:var(--pink)}
.bar>u{position:absolute;top:0;bottom:0;width:2px;background:var(--gold)} .bar>s{position:absolute;top:0;bottom:0;width:2px;background:var(--dim)}
.btns{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:10px}
.btn{font-size:10px;text-align:center;padding:5px 0;border-radius:6px;background:var(--panel2);color:var(--dim);border:1px solid transparent}
.btn.on{background:var(--pink);color:#2a0f1d;font-weight:700}
.arena-wrap{padding:8px}
#arena{width:100%;aspect-ratio:5/3;display:block;border-radius:10px;background:#101b1b}
.hint{color:var(--dim);font-size:12px;margin:6px 4px 0;line-height:1.45}
.row{display:grid;grid-template-columns:1fr 84px 46px;gap:8px;align-items:center;margin:5px 0;font-size:12px}
.row span.v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--pink)}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
button{font:inherit;font-weight:600;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:7px 11px;background:var(--panel2);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--pink)} button.primary{background:var(--pink);color:#2a0f1d;border-color:var(--pink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.diag{font-family:var(--mono);font-size:11px;line-height:1.7;color:var(--dim);font-variant-numeric:tabular-nums}
.diag b{color:var(--ink);font-weight:600} .diag .good{color:var(--green)} .diag .badv{color:var(--red)} .diag .warnv{color:var(--gold)}
#spark{width:100%;height:46px;display:block;margin-top:6px}
.curve canvas{width:100%;aspect-ratio:2/1;display:block}
textarea{width:100%;height:96px;margin-top:8px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:11px;padding:6px}
label.chk{display:flex;gap:6px;align-items:center;font-size:12px;margin-top:8px;color:var(--dim)}

#arena{cursor:crosshair;touch-action:none}
</style>

  function drawStick(canvas, raw, shaped, cfg) {
    const { g, w, h } = fit(canvas), c = w / 2, R = w / 2 - 6;
    g.clearRect(0, 0, w, h);
    g.fillStyle = "#101b1b";
    g.beginPath();
    g.arc(c, c, R, 0, 7);
    g.fill();
    g.fillStyle = "rgba(255,107,107,.30)";
    g.beginPath();
    g.arc(c, c, R * cfg.inner, 0, 7);
    g.fill();
    g.strokeStyle = "#2c3d42";
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(c - R, c);
    g.lineTo(c + R, c);
    g.moveTo(c, c - R);
    g.lineTo(c, c + R);
    g.stroke();
    g.strokeStyle = "#2c3d42";
    g.beginPath();
    g.arc(c, c, R, 0, 7);
    g.stroke();
    g.strokeStyle = "#ffd23f";
    g.setLineDash([4, 4]);
    g.beginPath();
    g.arc(c, c, R * cfg.outer, 0, 7);
    g.stroke();
    g.setLineDash([]);
    g.strokeStyle = "#8fa5a6";
    g.lineWidth = 2;
    g.beginPath();
    g.arc(c + raw.x * R, c + raw.y * R, 6, 0, 7);
    g.stroke();
    g.fillStyle = "#ff6fb1";
    g.beginPath();
    g.arc(c + shaped.x * R, c + shaped.y * R, 5, 0, 7);
    g.fill();
  }
  function drawCurves() {
    const { g, w, h } = fit($("#cvCurve")), pad2 = 22, pw = w - pad2 - 8, ph = h - pad2 - 8;
    g.clearRect(0, 0, w, h);
    const X = (v) => pad2 + v * pw, Y = (v) => 8 + (1 - v) * ph;
    g.strokeStyle = "#2c3d42";

    g.beginPath();

    g.lineTo(X(1), Y(1));

    g.stroke();
    g.setLineDash([]);
    for (const [side, col, raw] of [["left", "#6cc4ff", I.left.raw], ["right", "#ff6fb1", I.right.raw]]) {
      const cfg = tuning.stick(side);

      g.lineWidth = 2;
      g.beginPath();
      for (let i = 0; i <= 80; i++) {
        const x = i / 80, y = curveAt(x, cfg);
        i ? g.lineTo(X(x), Y(y)) : g.moveTo(X(x), Y(y));

      g.stroke();
      g.fillStyle = col;
      g.beginPath();
      g.arc(X(clamp(raw, 0, 1)), Y(curveAt(clamp(raw, 0, 1), cfg)), 4, 0, 7);
      g.fill();
    }
    g.fillStyle = "#8fa5a6";
    g.font = "10px ui-monospace,monospace";
    g.fillText("push", X(0.46), h - 6);
    g.save();
    g.translate(10, Y(0.35));
    g.rotate(-Math.PI / 2);
    g.fillText("output", 0, 0);
    g.restore();
    g.fillStyle = "#6cc4ff";
    g.fillText("left", X(0.78), Y(0.2));
    g.fillStyle = "#ff6fb1";
    g.fillText("right", X(0.78), Y(0.1));
  }
  var ARENA = { w: 40, h: 24 };
  var pad = { x: 0, y: 0, aimX: 1, aimY: 0, shots: [], trail: [], fireT: 0, speed: 0 };
  var arenaEl = $("#arena");
  function arenaWorld(e) {
    const r = arenaEl.getBoundingClientRect(), s = Math.min(r.width / ARENA.w, r.height / ARENA.h);
    return { x: (e.clientX - r.left - r.width / 2) / s, y: (e.clientY - r.top - r.height / 2) / s };
  }
  arenaEl.addEventListener("pointermove", (e) => {
    const w = arenaWorld(e);
    mouse.x = w.x;
    mouse.y = w.y;
    mouse.moved = performance.now();
    mouse.inside = true;
  });
  arenaEl.addEventListener("pointerenter", () => {
    mouse.inside = true;
  });
  arenaEl.addEventListener("pointerleave", () => {
    if (!mouse.down) mouse.inside = false;
  });
  arenaEl.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    const w = arenaWorld(e);
    mouse.x = w.x;
    mouse.y = w.y;
    mouse.down = true;
    mouse.moved = performance.now();
    arenaEl.setPointerCapture?.(e.pointerId);
    keyUsedAt = performance.now();
  });
  var upMouse = () => {
    mouse.down = false;
  };
  arenaEl.addEventListener("pointerup", upMouse);
  arenaEl.addEventListener("pointercancel", upMouse);
  addEventListener("blur", upMouse);
  arenaEl.addEventListener("contextmenu", (e) => e.preventDefault());
  function simStep(dt) {
    const sp = tuning.get("pad.speed");
    pad.x = clamp(pad.x + I.left.x * sp * dt, -ARENA.w / 2 + 1, ARENA.w / 2 - 1);
    pad.y = clamp(pad.y + I.left.y * sp * dt, -ARENA.h / 2 + 1, ARENA.h / 2 - 1);
    pad.speed = I.left.mag * sp;
    if (I.mouseAim) {
      const a = mouseAim({ x: pad.x, y: pad.y }, mouse, { x: pad.aimX, y: pad.aimY });
      pad.aimX = a.x;
      pad.aimY = a.y;
    } else if (I.right.mag > 0.02) {
      pad.aimX = I.right.x / I.right.mag;
      pad.aimY = I.right.y / I.right.mag;
    } else if (I.left.mag > 0.2) {
      pad.aimX = I.left.x / I.left.mag;
      pad.aimY = I.left.y / I.left.mag;
    }
    pad.fireT -= dt;
    if (I.fire && pad.fireT <= 0) {
      pad.fireT = 0.14;
      pad.shots.push({ x: pad.x, y: pad.y, ax: pad.aimX, ay: pad.aimY, age: 0 });
      if ($("#rumbleFire").checked && lastPad?.rumble && performance.now() - rumbleBusy > 120) {
        rumbleBusy = performance.now();
        lastPad.rumble(0.35, 0.6, 60);
      }
    }
    for (const s of pad.shots) s.age += dt;
    pad.shots = pad.shots.filter((s) => s.age < 0.18);
    if (frameCount % 3 === 0) {
      pad.trail.push({ x: pad.x, y: pad.y });
      if (pad.trail.length > 36) pad.trail.shift();
    }
  }
  function drawArena() {
    const { g, w, h } = fit($("#arena"));
    const s = Math.min(w / ARENA.w, h / ARENA.h), ox = w / 2, oy = h / 2;
    const X = (v) => ox + v * s, Y = (v) => oy + v * s;
    const grad = g.createRadialGradient(ox, oy, 10, ox, oy, w * 0.6);
    grad.addColorStop(0, "#1b2b2a");
    grad.addColorStop(1, "#0e1717");
    g.fillStyle = grad;
    g.fillRect(0, 0, w, h);
    g.strokeStyle = "rgba(180,210,200,.07)";
    g.lineWidth = 1;
    g.beginPath();
    for (let x = -ARENA.w / 2; x <= ARENA.w / 2; x += 2) {
      g.moveTo(X(x), Y(-ARENA.h / 2));
      g.lineTo(X(x), Y(ARENA.h / 2));
    }
    for (let y = -ARENA.h / 2; y <= ARENA.h / 2; y += 2) {
      g.moveTo(X(-ARENA.w / 2), Y(y));
      g.lineTo(X(ARENA.w / 2), Y(y));
    }
    g.stroke();
    g.strokeStyle = "#3b5a52";
    g.lineWidth = 3;
    g.strokeRect(X(-ARENA.w / 2), Y(-ARENA.h / 2), ARENA.w * s, ARENA.h * s);
    g.fillStyle = "rgba(255,111,177,.35)";
    pad.trail.forEach((t, i) => {
      g.globalAlpha = i / pad.trail.length * 0.5;
      g.beginPath();
      g.arc(X(t.x), Y(t.y), s * 0.5 * (i / pad.trail.length), 0, 7);
      g.fill();
    });
    g.globalAlpha = 1;
    g.strokeStyle = "rgba(255,210,63,.55)";
    g.lineWidth = 2;
    g.setLineDash([6, 6]);
    g.beginPath();
    g.moveTo(X(pad.x), Y(pad.y));
    g.lineTo(X(pad.x + pad.aimX * 9), Y(pad.y + pad.aimY * 9));
    g.stroke();
    g.setLineDash([]);
    for (const sh of pad.shots) {
      const k = 1 - sh.age / 0.18;
      g.strokeStyle = `rgba(255,236,160,${k})`;
      g.lineWidth = 6 * k + 1;
      g.beginPath();
      g.moveTo(X(sh.x + sh.ax * 0.9), Y(sh.y + sh.ay * 0.9));
      g.lineTo(X(sh.x + sh.ax * (3 + 6 * (1 - k))), Y(sh.y + sh.ay * (3 + 6 * (1 - k))));
      g.stroke();
    }
    if (I.mouseAim) {
      const cx = X(mouse.x), cy = Y(mouse.y);
      g.strokeStyle = I.fire ? "#ff6fb1" : "#ffd23f";
      g.lineWidth = 2;
      g.beginPath();
      g.arc(cx, cy, 9, 0, 7);
      g.moveTo(cx - 15, cy);
      g.lineTo(cx - 5, cy);
      g.moveTo(cx + 5, cy);
      g.lineTo(cx + 15, cy);
      g.moveTo(cx, cy - 15);
      g.lineTo(cx, cy - 5);
      g.moveTo(cx, cy + 5);
      g.lineTo(cx, cy + 15);
      g.stroke();
    }
    const r = s * 0.7;
    g.fillStyle = "rgba(0,0,0,.35)";
    g.beginPath();
    g.ellipse(X(pad.x), Y(pad.y) + r * 0.7, r * 0.95, r * 0.4, 0, 0, 7);
    g.fill();
    g.fillStyle = "#ff6fb1";
    g.beginPath();
    g.arc(X(pad.x), Y(pad.y), r, 0, 7);
    g.fill();
    g.strokeStyle = "#2a1a24";
    g.lineWidth = 3;
    g.lineCap = "round";
    g.beginPath();
    g.moveTo(X(pad.x) + pad.aimX * r * 0.6, Y(pad.y) + pad.aimY * r * 0.6);
    g.lineTo(X(pad.x) + pad.aimX * r * 1.5, Y(pad.y) + pad.aimY * r * 1.5);
    g.stroke();
    for (const sx of [-1, 1]) {
      const ex = X(pad.x) + pad.aimX * r * 0.35 - pad.aimY * sx * r * 0.3, ey = Y(pad.y) + pad.aimY * r * 0.35 + pad.aimX * sx * r * 0.3;
      g.fillStyle = "#fff";
      g.beginPath();
      g.arc(ex, ey, r * 0.2, 0, 7);
      g.fill();
      g.fillStyle = "#241838";
      g.beginPath();
      g.arc(ex + pad.aimX * r * 0.07, ey + pad.aimY * r * 0.07, r * 0.1, 0, 7);
      g.fill();
    }
    g.fillStyle = "#8fa5a6";
    g.font = "11px ui-monospace,monospace";
    g.fillText(`speed ${fmt(pad.speed)} u/s`, 10, h - 10);
  }
  var ft = [];
  var frameCount = 0;
  var stepsLast = 0;
  var longFrames = 0;
  var framedBy = false;
  try {
    framedBy = window.self !== window.top;
  } catch {
    framedBy = true;
  }
  function drawSpark() {
    const { g, w, h } = fit($("#spark"));
    g.clearRect(0, 0, w, h);
    const y = (ms) => h - Math.min(1, ms / 40) * h;
    g.strokeStyle = "#2c3d42";
    g.beginPath();
    g.moveTo(0, y(16.7));
    g.lineTo(w, y(16.7));
    g.stroke();
    g.strokeStyle = "#6cc4ff";
    g.lineWidth = 1.5;
    g.beginPath();
    ft.forEach((v, i) => {
      const x = i / Math.max(1, 239) * w;
      i ? g.lineTo(x, y(v)) : g.moveTo(x, y(v));
    });
    g.stroke();
  }
  function updateDiag(p) {
    const sorted = ft.slice().sort((a, b) => a - b), avg = ft.reduce((a, b) => a + b, 0) / Math.max(1, ft.length);
    const p95 = sorted[Math.floor(sorted.length * 0.95)] || 0, max = sorted[sorted.length - 1] || 0;
    const api = p.apiError ? `<span class="badv">blocked (${p.apiError})</span>` : '<span class="good">ok</span>';
    const mapLine = !p.connected ? "-" : p.standard ? '<span class="good">standard</span>' : `<span class="warnv">${p.mapping} (non-standard, buttons may differ)</span>`;
    $("#diag").innerHTML = `frame <b>${fmt(avg, 1)}</b> ms avg \xB7 p95 <b>${fmt(p95, 1)}</b> \xB7 max <b>${fmt(max, 1)}</b><br>fps <b>${fmt(1e3 / Math.max(0.1, avg), 0)}</b> \xB7 long frames (&gt;25 ms) <b>${longFrames}</b><br>sim <b>${Math.round(1 / SIM_STEP)} Hz</b> fixed \xB7 steps this frame <b>${stepsLast}</b><br>gamepad api ${api} \xB7 pads <b>${p.count || 0}</b> \xB7 mapping ${mapLine}<br>pad updates <b>${p.connected ? fmt(p.updateHz, 0) : "-"}</b> Hz \xB7 input source <b>${I.source === "keyboard" ? I.mouseAim ? "keyboard + mouse" : "keyboard" : I.source}</b><br>in a frame <b>${framedBy ? "yes" : "no"}</b>` + (framedBy && !p.connected && p.everSeen === false ? ' <span class="warnv">(if your controller never shows, the frame may block it; see README)</span>' : "");
  }
  function updateChips(p) {
    const c = $("#chipSrc"), id = $("#chipId");
    if (p.connected) {
      c.className = "chip ok";
      c.textContent = "Controller connected";
      id.hidden = false;
      id.className = "chip";
      id.textContent = p.id.replace(/\s*\(.*\)\s*$/, "").slice(0, 44);
    } else if (I.source === "keyboard" && performance.now() - Math.max(keyUsedAt, mouse.moved) < 4e3) {
      c.className = "chip warn";
      c.textContent = "Keyboard + mouse";
      id.hidden = true;
    } else if (p.apiError) {
      c.className = "chip bad";
      c.textContent = "Controller access blocked";
      id.hidden = true;
    } else {
      c.className = "chip warn";
      c.textContent = "Press any button on your controller";
      id.hidden = true;
    }
  }
  function updateHud(p) {
    const L = I.left, R = I.right;
    $("#nL").innerHTML = `L raw <b>${fmt(I.leftRaw.x)}, ${fmt(I.leftRaw.y)}</b><br>mag <b>${fmt(L.raw)}</b> \u2192 <b>${fmt(L.mag)}</b>`;
    $("#nR").innerHTML = `R raw <b>${fmt(I.rightRaw.x)}, ${fmt(I.rightRaw.y)}</b><br>mag <b>${fmt(R.raw)}</b> \u2192 <b>${fmt(R.mag)}</b>`;
    const t = tuning.trigger();
    const lt = $("#tLT"), rt = $("#tRT");
    $(".bar>b", lt).style.width = I.lt * 100 + "%";
    $(".num", lt).textContent = fmt(I.lt);
    $(".bar>b", rt).style.width = I.rt * 100 + "%";
    $(".num", rt).textContent = fmt(I.rt);
    $(".bar>u", rt).style.left = t.press * 100 + "%";
    $(".bar>s", rt).style.left = t.release * 100 + "%";
    rt.querySelector(".bar").classList.toggle("down", I.fire);
    const host = $("#btns");
    if (!host.children.length) BUTTON_NAMES.forEach((n) => {
      const d = document.createElement("div");
      d.className = "btn";
      d.textContent = n;
      host.appendChild(d);
    });
    [...host.children].forEach((el, i) => el.classList.toggle("on", !!I.buttons[i]?.pressed));

  }
  var last = performance.now();
  var acc = 0;
  function frame(now) {
    const dtMs = Math.max(0, now - last);
    last = now;
    if (dtMs > 0) {

      if (ft.length > 240) ft.shift();
    }
    if (dtMs > 25) longFrames++;
    acc += Math.min(0.1, dtMs / 1e3);
    const p = sampleInput(now);
    stepDrift(now);
    stepsLast = 0;
    while (acc >= SIM_STEP) {
      simStep(SIM_STEP);
      acc -= SIM_STEP;
      stepsLast++;
      frameCount++;

    drawStick($("#cvL"), I.leftRaw, I.left, tuning.stick("left"));
    drawStick($("#cvR"), I.rightRaw, I.right, tuning.stick("right"));

    drawArena();
    drawSpark();
    updateHud(p);
    updateChips(p);
    if (frameCount % 6 === 0 || stepsLast === 0) updateDiag(p);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__lab = { I, pad, tuning, simStep, state: () => ({ source: I.source, fire: I.fire }) };
})();
</script>
